<!DOCTYPE html>
<html>

<head>
    <title>Chase6477 - Float32 Converter</title>
    <script src="floatScript.js"></script>
</head>

<body>

    <table onchange="updateCheckBoxes()">
        <tr>
            <td>
                <div>
                    <input type="checkbox" id="cb1">
                </div>
            </td>
            <td>
                <div>
                    <input type="checkbox" id="cb2">
                    <input type="checkbox" id="cb3">
                    <input type="checkbox" id="cb4">
                    <input type="checkbox" id="cb5">
                </div>
            </td>
            <td>
                <div>
                    <input type="checkbox" id="cb6">
                    <input type="checkbox" id="cb7">
                    <input type="checkbox" id="cb8">
                    <input type="checkbox" id="cb9">
                </div>
            </td>
            <td>
                <div>
                    <input type="checkbox" id="cb10">
                    <input type="checkbox" id="cb11">
                    <input type="checkbox" id="cb12">
                    <input type="checkbox" id="cb13">
                </div>
            </td>
            <td>
                <div>
                    <input type="checkbox" id="cb14">
                    <input type="checkbox" id="cb15">
                    <input type="checkbox" id="cb16">
                    <input type="checkbox" id="cb17">
                </div>
            <td>
                <div>
                    <input type="checkbox" id="cb18">
                    <input type="checkbox" id="cb19">
                    <input type="checkbox" id="cb20">
                    <input type="checkbox" id="cb21">
                </div>
            </td>
            <td>
                <div>
                    <input type="checkbox" id="cb22">
                    <input type="checkbox" id="cb23">
                    <input type="checkbox" id="cb24">
                    <input type="checkbox" id="cb25">
                </div>
            <td>
                <div>
                    <input type="checkbox" id="cb26">
                    <input type="checkbox" id="cb27">
                    <input type="checkbox" id="cb28">
                    <input type="checkbox" id="cb29">
                </div>
            </td>
            <td>
                <div>
                    <input type="checkbox" id="cb30">
                    <input type="checkbox" id="cb31">
                    <input type="checkbox" id="cb32">
                </div>
            </td>
        </tr>
    </table>

    <table>
        <tr>
            <td>
                Decimal:
            </td>
            <td>
                <input size="35" onchange="updateDecimal(this.value)" id="decimal" inputmode="numeric" value="0"
                    autocomplete="off"></input>
            </td>
        </tr>
        <tr>
            <td>
                Float:
            </td>
            <td>
                <input size="35" onchange="updateFloat(this.value)" id="float" inputmode="numeric" value="0"
                    autocomplete="off"></input>
            </td>
        </tr>
        <tr>
            <td>
                Binary:
            </td>
            <td>
                <input size="35" onchange="updateBinary(this.value)" id="binary" maxlength="32" inputmode="numeric"
                    value="00000000000000000000000000000000" autocomplete="off"></input>
            </td>
        </tr>
        <tr>
            <td>
                Hex:
            </td>
            <td>
                <input size="35" onchange="updateHexa(this.value)" id="hexa" maxlength="8" value="00000000"
                    autocomplete="off"></input>
            </td>
        </tr>
    </table>
    <br>
    <br>

    <tr>
        <td><button onclick="addBinary(1)">add</button></td>
        <td><button onclick="addBinary(-1)">sub</button></td>
    </tr>

</body>

</html>
